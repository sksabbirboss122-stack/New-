name: GlowShield APK Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract Source
        run: unzip -o GlowShield-Browser-v1.0.0-Source.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GlowShield-Browser
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowShield-Browser-APK
          path: GlowShield-Browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
