name: GlowShield APK Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract Source
        run: unzip -o GlowShield-Browser-v1.0.0-Source.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -f "$SDK/platforms/android-35/android.jar"
          test -d "$SDK/build-tools/35.0.0"
          echo "sdk.dir=$SDK" > GlowShield-Browser/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GlowShield-Browser
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowShield-Browser-APK
          path: GlowShield-Browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
